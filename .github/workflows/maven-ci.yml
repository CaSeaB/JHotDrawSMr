name: JHotDraw Continuous Integration Pipeline

# Trigger the workflow on push or pull request events against the main branch
on:
  push:
    branches: [ main, feature/undo ]
  pull_request:
    branches: [ main, feature/undo ]

jobs:
  build-and-test:
    name: Build Multi-Module Project and Execute Tests
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the developer's working copy from the repository
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Set up a secure, reproducible Java Development Kit (JDK) 
    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # Automatically cache dependency .jar files to accelerate future runs

    # Step 3: Run the compile lifecycle step using the custom maven settings profile
    - name: Build Application with Maven
      run: mvn clean compile --settings .maven-settings.xml

    # Step 4: Execute the unit and integration test suites automatically
    - name: Execute Automated Test Suite
      run: mvn test --settings .maven-settings.xml